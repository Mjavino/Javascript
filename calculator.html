<!DOCTYPE html>
<html lang="en">
<head>
    <title>CALCULATOR</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <table border="1">
        <tr>
        <td colspan="4">
            <input type="text" id="historyBox" value="" readonly style="text-align:right; color: gray;">
        </td>
    </tr>
        <tr>
            <td colspan="4">
                <input type="text" id="inputBox" value="0" readonly>
            </td>
        </tr>
        <tr>
            <td onclick="digitBtnPressed(7)">7</td>
            <td onclick="digitBtnPressed(8)">8</td>
            <td onclick="digitBtnPressed(9)">9</td>
            <td onclick="operatorBtnPressed('*')">x</td>
        </tr>
        <tr>
            <td onclick="digitBtnPressed(4)">4</td>
            <td onclick="digitBtnPressed(5)">5</td>
            <td onclick="digitBtnPressed(6)">6</td>
            <td onclick="operatorBtnPressed('-')">-</td>
        </tr>
        <tr>
            <td onclick="digitBtnPressed(1)">1</td>
            <td onclick="digitBtnPressed(2)">2</td>
            <td onclick="digitBtnPressed(3)">3</td>
            <td onclick="operatorBtnPressed('+')">+</td>
        </tr>
        <tr>
            <td colspan="1" onclick="digitBtnPressed(0)">0</td>
            <td onclick="btnACPressed()">AC</td>
            <td onclick="backspacePressed()">🔙</td>
            <td onclick="operatorBtnPressed('/')">/</td>
            
        </tr>
        <tr>
            
            <td colspan="2" onclick="equalsPressed()">=</td>
            <td onclick="clearEntryPressed()">🧹</td>
        </tr>
        
    </table>

    <script>
    let newline = true;
let value1 = null;
let currentOperator = null;

function digitBtnPressed(button) {
    const inputBox = document.getElementById("inputBox");
    if (newline) {
        inputBox.value = button;
        newline = false;
    } else {
        inputBox.value += button;
    }
}

function btnACPressed() {
    document.getElementById("inputBox").value = "0";
    document.getElementById("historyBox").value = "";
    value1 = null;
    currentOperator = null;
    newline = true;
}

function operatorBtnPressed(operator) {
    const inputBox = document.getElementById("inputBox");
    value1 = parseFloat(inputBox.value);
    currentOperator = operator;
    document.getElementById("historyBox").value = inputBox.value + " " + operator;
    newline = true;
}

function equalsPressed() {
    const inputBox = document.getElementById("inputBox");
    const value2 = parseFloat(inputBox.value);
    let result;

    switch (currentOperator) {
        case '+':
            result = value1 + value2;
            break;
        case '-':
            result = value1 - value2;
            break;
        case '*':
            result = value1 * value2;
            break;
        case '/':
            result = value2 !== 0 ? value1 / value2 : 'Error';
            break;
        default:
            result = value2;
    }

    document.getElementById("inputBox").value = result;
    if (currentOperator !== null && value1 !== null) {
        document.getElementById("historyBox").value = value1 + " " + currentOperator + " " + value2 + " =";
    }

    value1 = typeof result === 'number' ? result : null;
    currentOperator = null;
    newline = true;
}
        function backspacePressed() {
    const inputBox = document.getElementById("inputBox");
    if (!newline && inputBox.value.length > 1) {
        inputBox.value = inputBox.value.slice(0, -1);
    } else {
        inputBox.value = "0";
        newline = true;
    }
}

function clearEntryPressed() {
    document.getElementById("inputBox").value = "0";
    newline = true;
}
    </script>
</body>
</html>
